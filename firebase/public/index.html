<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập STORE RFID</title><link rel="stylesheet" href="style.css"></head>
<body><main class="right-panel" style="width:100%;min-height:100vh"><div class="login-box"><h2>STORE RFID</h2><p class="sub-title">Quản lý nhiều cửa hàng và sản phẩm</p>
<form id="loginForm"><div class="input-group"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="input-group"><label>Mật khẩu</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="main-button">Đăng nhập</button></form>
<button id="resetPassword" class="secondary-button" style="margin-top:12px">Quên mật khẩu</button><p id="message" class="status" role="status"></p>
<details><summary>Tạo tài khoản mới</summary><form id="registerForm" style="margin-top:20px"><div class="input-group"><label>Email</label><input id="registerEmail" type="email" autocomplete="username" required></div><div class="input-group"><label>Mật khẩu (ít nhất 6 ký tự)</label><input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required></div><div class="input-group"><label>Nhập lại mật khẩu</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></div><button class="main-button">Đăng ký</button></form></details>
</div></main><script type="module" src="auth.js"></script></body></html>
